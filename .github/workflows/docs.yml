name: Documentação

# Publica o site MkDocs (docs/) no GitHub Pages a cada push na branch padrão.
# Em pull request, apenas constrói (com --strict) para pegar link quebrado.
#
# Pré-requisito no repositório: Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "mkdocs_hooks.py"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "mkdocs_hooks.py"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Construir o site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Copiar o CHANGELOG para a documentação
        run: cp CHANGELOG.md docs/changelog.md

      - name: Construir (falha em link quebrado)
        run: mkdocs build --strict

      - name: Publicar artefato do Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publicar no GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
