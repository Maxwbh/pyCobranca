name: CI

# Branch de trabalho é coberta pelo PR, não pelo push: com gatilho nos dois, um
# push numa branch com PR aberto rodava a CI **duas vezes**, idêntica.
#
# A `hml` também sai do push por dois motivos: ela é head do PR de promoção
# para a `main` (que já dispara a CI por `pull_request`), e o `hml.yml` repete
# ali tudo que está aqui — ruff, a suíte nas três versões, exemplos e build.
# Sobra a `main`, onde nenhum PR entra e a CI é a conferência pós-merge.
on:
  push:
    branches: ["main"]
  pull_request:

# A chave precisa ser o PR, não `github.ref`: em `push` o ref é
# `refs/heads/<branch>` e em `pull_request` é `refs/pull/<n>/merge` — grupos
# diferentes para o mesmo commit, e o cancel-in-progress nunca agia.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint e formatação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatação (ruff format)
        run: ruff format --check .

  test:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Testes (pytest)
        run: pytest --cov=pycobranca --cov-report=term-missing

  exemplos:
    name: Exemplos executáveis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar a biblioteca
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Executar os exemplos
        run: python examples/executa_todos.py

  build:
    name: Build do pacote
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar build
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Construir distribuições (sdist + wheel)
        run: python -m build

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
