<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" width="1040" height="430" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Arquitetura da PyCobrança: ERPs e frameworks consomem a PyCobrança, que emite boletos, CNAB, PIX e PDF.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C1D2B"/>
      <stop offset="1" stop-color="#0A1622"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#127C74"/>
      <stop offset="1" stop-color="#0F5F59"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#32BCAD"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="430" rx="18" fill="url(#bg)"/>

  <!-- título -->
  <text x="520" y="46" text-anchor="middle" fill="#EEF3F5" font-size="22" font-weight="700">Arquitetura</text>
  <text x="520" y="70" text-anchor="middle" fill="#8AA0AD" font-size="13.5">a sua aplicação chama a PyCobrança, que emite os artefatos de cobrança</text>

  <!-- camada consumidora -->
  <text x="520" y="112" text-anchor="middle" fill="#7FE3D6" font-size="12.5" font-weight="700" letter-spacing="1.5">SUA APLICAÇÃO</text>
  <g fill="#132A3A" stroke="#274357" stroke-width="1.2">
    <rect x="150" y="128" width="148" height="46" rx="10"/>
    <rect x="316" y="128" width="148" height="46" rx="10"/>
    <rect x="482" y="128" width="148" height="46" rx="10"/>
    <rect x="648" y="128" width="148" height="46" rx="10"/>
    <rect x="814" y="128" width="76" height="46" rx="10"/>
  </g>
  <g fill="#DCE6EB" font-size="15" text-anchor="middle" font-weight="600">
    <text x="224" y="157">ERP</text>
    <text x="390" y="157">FastAPI</text>
    <text x="556" y="157">Django</text>
    <text x="722" y="157">Flask</text>
    <text x="852" y="157">Node</text>
  </g>

  <!-- setas para o núcleo -->
  <g stroke="#32BCAD" stroke-width="2" fill="none" opacity="0.85">
    <path d="M224 174 L224 208 L520 208" marker-end="url(#arrow)"/>
    <path d="M390 174 L390 208" />
    <path d="M556 174 L556 208" />
    <path d="M722 174 L722 208 L520 208"/>
    <path d="M852 174 L852 208 L520 208"/>
    <path d="M520 200 L520 232" marker-end="url(#arrow)"/>
  </g>

  <!-- núcleo PyCobrança -->
  <rect x="150" y="236" width="740" height="164" rx="16" fill="url(#core)" stroke="#32BCAD" stroke-width="1.5"/>
  <text x="180" y="272" fill="#EAFBF8" font-size="21" font-weight="800">Py<tspan fill="#7FE3D6">Cobrança</tspan></text>
  <text x="180" y="294" fill="#Bfeee8" font-size="12.5">motor de cobrança bancária · Python puro · sem dependências de sistema</text>

  <g>
    <rect x="180" y="312" width="158" height="66" rx="11" fill="#0E4B47" stroke="#1C6E67" stroke-width="1"/>
    <rect x="350" y="312" width="158" height="66" rx="11" fill="#0E4B47" stroke="#1C6E67" stroke-width="1"/>
    <rect x="520" y="312" width="158" height="66" rx="11" fill="#0E4B47" stroke="#1C6E67" stroke-width="1"/>
    <rect x="690" y="312" width="180" height="66" rx="11" fill="#0E4B47" stroke="#1C6E67" stroke-width="1"/>
  </g>
  <g text-anchor="middle" fill="#EAFBF8">
    <text x="259" y="342" font-size="16" font-weight="700">Boletos</text>
    <text x="259" y="362" font-size="11" fill="#9FD9D2">código de barras · DV</text>
    <text x="429" y="342" font-size="16" font-weight="700">CNAB</text>
    <text x="429" y="362" font-size="11" fill="#9FD9D2">remessa/retorno 240/400</text>
    <text x="599" y="342" font-size="16" font-weight="700">PIX</text>
    <text x="599" y="362" font-size="11" fill="#9FD9D2">Bolepix · BR Code · QR</text>
    <text x="780" y="342" font-size="16" font-weight="700">PDF</text>
    <text x="780" y="362" font-size="11" fill="#9FD9D2">ReportLab · carnê · tema</text>
  </g>
</svg>
